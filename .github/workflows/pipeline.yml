# CD: run the SageMaker pipeline on demand from the GitHub Actions tab.
# Auth is OIDC: GitHub proves its identity to AWS and receives temporary
# credentials for the role in infra/. No AWS keys are stored in GitHub.
name: Run SageMaker pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        type: choice
        options: [processing+training, processing, training]
        default: processing+training

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: read

jobs:
  tests:
    # Reuse CI: never launch paid AWS jobs from code that fails its tests.
    uses: ./.github/workflows/ci.yml

  run:
    needs: tests
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'   # the IAM trust policy only allows main anyway
    steps:
      - uses: actions/checkout@v5

      # TEMPORARY debug step: prints the identity claims GitHub sends to AWS,
      # so they can be compared with infra/github-oidc-trust.json.
      # Prints only the decoded claims, never the token itself. Remove once
      # OIDC works.
      - name: "Debug: show OIDC token claims"
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'EOF'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ["sub", "aud", "repository", "ref", "event_name", "job_workflow_ref"]:
              print(f"{k:<18} {claims.get(k)}")
          EOF
          echo "role ARN in use:  ${{ vars.AWS_ROLE_ARN }}"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SageMaker SDK
        run: pip install "sagemaker<3"   # 3.x reorganized the modules these scripts use

      - name: Processing job
        if: contains(inputs.stage, 'processing')
        run: python src/launch_processing.py

      - name: Training job
        if: contains(inputs.stage, 'training')
        run: python src/launch_training.py
