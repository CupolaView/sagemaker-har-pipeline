# CI: lint + unit tests on every push and pull request.
# No AWS access: these tests run the pipeline's logic locally on fake data.
name: CI

on:
  push:
  pull_request:
  workflow_call:   # lets pipeline.yml run these tests before launching AWS jobs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # matches the SageMaker container (py312)
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: much smaller download, and CI has no GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -v
